<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Gausa Guide &#8482;</title>
  <meta name="description" content="A little leaving gift from the team." />

  <link rel="icon" href="images/ngfavicon.ico" type="image/x-icon" />
  <script src="js/basicauth.js"></script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">The National Gallery presents</p>
      <h1>The Gausa Guide &#8482;</h1>
      <p class="intro">
        For Laura, with love from your National Gallery colleagues.
      </p>
      <a class="button" href="#The Guide">Listen to the guide</a>
    </div>
  </header>

  <main>

    <section class="section section-alt" id="messages">
        <div class="container">
            <h2>The Guide</h2>
            <p>Press start, then swipe or use the arrows to move through the memories.</p>

            <div class="memory-layout">
            <div class="memory-poster">
                <img src="images/gausa-poster.jpg" alt="The Gausa Guide poster" />
            </div>

            <div class="memory-player">
                <div class="swiper memory-swiper">
                <div id="memorySlides" class="swiper-wrapper">
                    <!-- Slides are generated by js/memory-player.js -->
                </div>

                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                </div>
            </div>
            </div>

            <div class="memory-controls">
            <button id="memoryStartButton" class="button" type="button">
                Start playlist
            </button>

            <button id="memoryPauseButton" class="button button-secondary" type="button">
                Pause
            </button>
            </div>

            <p id="memoryStatus" class="memory-status">
            Ready to start
            </p>

            <audio id="memoryAudio" preload="metadata"></audio>
        </div>
        </section>
  </main>

  <footer class="footer">
    <div class="container">
      Built by JP
    </div>
  </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/memory-player.js"></script>
</body>
</html>
